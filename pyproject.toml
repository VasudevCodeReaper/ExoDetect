[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exodetect"
version = "1.0.0"
description = "Explainable exoplanet candidate detection from noisy light curves"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "astropy>=5.3", "matplotlib>=3.7", "scikit-learn>=1.3", "joblib>=1.3", "lightkurve>=2.4", "streamlit>=1.37", "plotly>=5.22"]

[project.optional-dependencies]
tess = ["lightkurve>=2.4"]
dev = ["pytest>=7.4"]

[project.scripts]
exodetect = "exodetect.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
